name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # Generates the release body from commit subjects since the previous tag
  # (previous STABLE tag for final releases), with CGUI-* Jira links.
  # Ported from tkforgeworks/anvil.
  release-notes:
    runs-on: ubuntu-latest
    outputs:
      body: ${{ steps.notes.outputs.body }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - id: notes
        run: |
          BODY=$(node scripts/generate-release-notes.js)
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        env:
          JIRA_BASE_URL: ${{ vars.JIRA_BASE_URL }}
          RELEASE_VERSION: ${{ github.ref_name }}

  build-windows:
    runs-on: windows-latest
    needs: release-notes
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules for Electron
        run: npx electron-rebuild

      - name: Build main and renderer
        run: npm run build

      - name: Build installer
        run: npm run dist -- --publish never

      # Immutable releases lock assets at publish time, so the release must be
      # created as a draft, assets uploaded, and only then published.
      - name: Create draft release with assets
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
          body: ${{ needs.release-notes.outputs.body }}
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit ${{ github.ref_name }} --draft=false
