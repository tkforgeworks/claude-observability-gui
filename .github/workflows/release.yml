name: Release

# Tagless release pipeline (CGUI-65, ported from tkforgeworks/anvil):
# version bumps are ordinary commits, this workflow triggers on branch pushes
# and self-gates on whether the version's tag already exists, and the tag is
# created server-side when the GitHub release is published. RC prereleases cut
# from v*/main release branches; stable releases cut on merge to main.
on:
  push:
    branches: [main, 'v*/main']

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check-release:
    runs-on: ubuntu-latest
    outputs:
      should-release: ${{ steps.check.outputs.should-release }}
      version: ${{ steps.check.outputs.version }}
      is-prerelease: ${{ steps.check.outputs.is-prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          BRANCH="${{ github.ref_name }}"
          IS_RC=false
          if echo "$VERSION" | grep -qE '(rc|alpha|beta)'; then
            IS_RC=true
          fi
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists — skipping release"
            echo "should-release=false" >> $GITHUB_OUTPUT
          elif [ "$BRANCH" = "main" ] && [ "$IS_RC" = "true" ]; then
            # An RC version should never merge to main — run release:final on
            # the release branch first.
            echo "RC version $VERSION on main — skipping release"
            echo "should-release=false" >> $GITHUB_OUTPUT
          elif [ "$BRANCH" != "main" ] && [ "$IS_RC" = "false" ]; then
            # The release:final bump pushes a stable version to the release
            # branch before its PR merges; the stable release is cut on main.
            echo "Stable version $VERSION on $BRANCH — releasing on merge to main, skipping"
            echo "should-release=false" >> $GITHUB_OUTPUT
          else
            echo "Tag $TAG does not exist — will release"
            echo "should-release=true" >> $GITHUB_OUTPUT
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "is-prerelease=$IS_RC" >> $GITHUB_OUTPUT
          fi

  # TK ForgeWorks standard release-notes generation — canonical script and
  # workflow live in tkforgeworks/.github. release-version is passed
  # explicitly because this workflow runs before the tag is created.
  release-notes:
    if: needs.check-release.outputs.should-release == 'true'
    needs: check-release
    uses: tkforgeworks/.github/.github/workflows/release-notes.yml@main
    with:
      ticket-prefix: CGUI
      release-version: v${{ needs.check-release.outputs.version }}

  # Gate the build: no release is cut if type-check or tests fail.
  typecheck-and-test:
    if: needs.check-release.outputs.should-release == 'true'
    needs: check-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run compile

      - name: Run tests
        run: npm test

  # Platform builds only produce artifacts (CGUI-79) — they never touch the
  # GitHub release. Immutable releases lock assets at publish time, so a
  # single downstream job creates the one draft with every platform's assets
  # and publishes it; two builders racing the same tag would break that.
  build-windows:
    if: needs.check-release.outputs.should-release == 'true'
    runs-on: windows-latest
    needs: [check-release, release-notes, typecheck-and-test]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules for Electron
        run: npx electron-rebuild

      - name: Build main and renderer
        run: npm run build

      - name: Build installer
        run: npm run dist -- --publish never

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: release/*.exe
          if-no-files-found: error

  # The runner's glibc sets the AppImage/deb compatibility floor — keep this
  # on the oldest ubuntu-latest offers when that choice comes up.
  build-linux:
    if: needs.check-release.outputs.should-release == 'true'
    runs-on: ubuntu-latest
    needs: [check-release, release-notes, typecheck-and-test]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules for Electron
        run: npx electron-rebuild

      - name: Build main and renderer
        run: npm run build

      - name: Build AppImage and deb
        run: npm run dist -- --publish never

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-packages
          path: |
            release/*.AppImage
            release/*.deb
          if-no-files-found: error

  # Single publish point: create the draft with ALL platform assets, then
  # flip it live. Publishing creates the v{version} tag at the triggering
  # commit (immutable releases lock assets at publish time).
  publish:
    if: needs.check-release.outputs.should-release == 'true'
    runs-on: ubuntu-latest
    needs: [check-release, release-notes, build-windows, build-linux]
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist-assets
          merge-multiple: true

      - name: Create draft release with assets
        id: draft
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.check-release.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            dist-assets/*.exe
            dist-assets/*.AppImage
            dist-assets/*.deb
          body: ${{ needs.release-notes.outputs.body }}
          draft: true
          prerelease: ${{ needs.check-release.outputs.is-prerelease }}

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PATCH repos/${{ github.repository }}/releases/${{ steps.draft.outputs.id }} -F draft=false
